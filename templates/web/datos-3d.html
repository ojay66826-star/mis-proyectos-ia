<script type="module">
import * as THREE from "three";
import { FontLoader } from "three/addons/loaders/FontLoader.js";
import { TextGeometry } from "three/addons/geometries/TextGeometry.js";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";

const q = new URLSearchParams(location.search);
const SCENE = Number(q.get("scene") || 0);
window.__ready = false;
window.__duration = Number(q.get("duration") || 8);
const D = window.__duration;

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = SCENE === 2 ? .85 : 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 400);
const cap = document.getElementById("cap"), tag = document.getElementById("tag"), flash = document.getElementById("flash");

// ---------- utilidades deterministas
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const back = x => { x = clamp(x); const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const lerp = (a, b, k) => a + (b - a) * k;
const R = (s => () => (s = (s * 16807) % 2147483647) / 2147483647)(11 + SCENE * 97);
const M = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: .45, ...o });
const add = (o, p = scene) => { p.add(o); return o; };
const shadow = o => { o.traverse(m => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; } }); return o; };
const updaters = [];
const on = f => updaters.push(f);

function lights(sky, ground, keyCol = "#fff3e0", ki = 2.4) {
  add(new THREE.HemisphereLight(sky, ground, 1.0));
  const key = add(new THREE.DirectionalLight(keyCol, ki)); key.position.set(4, 7, 5); key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048); Object.assign(key.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8 });
  const rim = add(new THREE.DirectionalLight("#b3e5fc", 1.4)); rim.position.set(-5, 4, -5);
  return key;
}
function particles(n, box, color, size, fn) {
  const g = new THREE.BufferGeometry(), base = new Float32Array(n * 3), pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { base[i * 3] = (R() - .5) * box[0]; base[i * 3 + 1] = R() * box[1]; base[i * 3 + 2] = (R() - .5) * box[2]; }
  g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  const p = add(new THREE.Points(g, new THREE.PointsMaterial({ color, size, transparent: true, opacity: .85, depthWrite: false, blending: THREE.AdditiveBlending })));
  on(t => { for (let i = 0; i < n; i++) { const o = fn(base[i * 3], base[i * 3 + 1], base[i * 3 + 2], t, i); pos[i * 3] = o[0]; pos[i * 3 + 1] = o[1]; pos[i * 3 + 2] = o[2]; } g.attributes.position.needsUpdate = true; });
  return p;
}
function confetti(n, y0 = 7) {
  const cols = ["#ff1744", "#ffea00", "#00e676", "#2979ff", "#d500f9", "#ff9100"];
  const geo = new THREE.PlaneGeometry(.12, .2), arr = [];
  for (let i = 0; i < n; i++) {
    const m = add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: cols[i % 6], side: THREE.DoubleSide })));
    arr.push({ m, x: (R() - .5) * 12, z: (R() - .5) * 6, s: .6 + R() * .8, ph: R() * 6, d: R() * 2 });
  }
  on(t => arr.forEach(c => {
    const tt = t - c.d; const y = y0 - ((tt * c.s * 1.4) % (y0 + 2));
    c.m.position.set(c.x + Math.sin(t * 2 + c.ph) * .4, tt < 0 ? 50 : y, c.z);
    c.m.rotation.set(t * 4 + c.ph, t * 3 + c.ph, 0);
  }));
}
function glowSprite(color, size) {
  const c = document.createElement("canvas"); c.width = c.height = 128; const x = c.getContext("2d");
  const g = x.createRadialGradient(64, 64, 0, 64, 64, 64); g.addColorStop(0, color); g.addColorStop(.35, color + "88"); g.addColorStop(1, color + "00");
  x.fillStyle = g; x.fillRect(0, 0, 128, 128);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), blending: THREE.AdditiveBlending, depthWrite: false }));
  s.scale.set(size, size, 1); return s;
}

// ---------- personaje: Profe Bambú (panda 3D procedural)
function makePanda() {
  const W = M("#fafafa", { roughness: .6 }), B = M("#1e1e24", { roughness: .55 });
  const root = new THREE.Group(), body = add(new THREE.Group(), root);
  const torso = add(new THREE.Mesh(new THREE.SphereGeometry(.62, 48, 32), W), body); torso.scale.set(1, 1.08, .92); torso.position.y = .7;
  const belt = add(new THREE.Mesh(new THREE.TorusGeometry(.6, .1, 16, 48), B), body); belt.rotation.x = Math.PI / 2; belt.position.y = .95; belt.scale.set(1, .92, 1);
  const head = add(new THREE.Group(), body); head.position.y = 1.62;
  add(new THREE.Mesh(new THREE.SphereGeometry(.55, 48, 32), W), head).scale.set(1.08, .95, .95);
  for (const s of [-1, 1]) {
    const ear = add(new THREE.Mesh(new THREE.SphereGeometry(.18, 24, 16), B), head); ear.position.set(s * .42, .42, -.05);
    const patch = add(new THREE.Mesh(new THREE.SphereGeometry(.15, 24, 16), B), head); patch.scale.set(.85, 1.15, .5); patch.position.set(s * .2, .05, .45); patch.rotation.z = s * .5;
    const eye = add(new THREE.Mesh(new THREE.SphereGeometry(.065, 16, 12), M("#fff", { roughness: .1 })), head); eye.position.set(s * .2, .08, .52);
    const pup = add(new THREE.Mesh(new THREE.SphereGeometry(.035, 12, 8), M("#000", { roughness: .05 })), head); pup.position.set(s * .2, .08, .58);
    const glass = add(new THREE.Mesh(new THREE.TorusGeometry(.14, .02, 12, 32), M("#ff9800", { metalness: .6, roughness: .25 })), head); glass.position.set(s * .2, .07, .56);
    const cheek = add(new THREE.Mesh(new THREE.SphereGeometry(.07, 12, 8), M("#ff8a80", { roughness: .8 })), head); cheek.position.set(s * .33, -.13, .45); cheek.scale.z = .4;
  }
  const bridge = add(new THREE.Mesh(new THREE.CylinderGeometry(.015, .015, .12), M("#ff9800", { metalness: .6 })), head); bridge.rotation.z = Math.PI / 2; bridge.position.set(0, .1, .58);
  const nose = add(new THREE.Mesh(new THREE.SphereGeometry(.07, 16, 12), B), head); nose.scale.set(1.3, .8, .8); nose.position.set(0, -.08, .55);
  const mouth = add(new THREE.Mesh(new THREE.SphereGeometry(.06, 16, 12), M("#b71c1c")), head); mouth.position.set(0, -.22, .5); mouth.scale.set(1.2, .3, .5);
  const arms = [-1, 1].map(s => {
    const sh = add(new THREE.Group(), body); sh.position.set(s * .58, 1.05, 0);
    const a = add(new THREE.Mesh(new THREE.CapsuleGeometry(.15, .45, 8, 16), B), sh); a.position.y = -.3; return sh;
  });
  const legs = [-1, 1].map(s => { const l = add(new THREE.Mesh(new THREE.CapsuleGeometry(.19, .2, 8, 16), B), root); l.position.set(s * .3, .2, .05); return l; });
  shadow(root);
  return { root, body, head, arms, legs, mouth };
}
function talk(p, t, speaking = true) { p.mouth.scale.y = speaking ? .3 + Math.abs(Math.sin(t * 17)) * .9 * (.6 + .4 * Math.sin(t * 5)) : .3; }

// ---------- texto 3D
let FONT = null;
function text3d(str, size, color, emissive) {
  const g = new TextGeometry(str, { font: FONT, size, depth: size * .35, curveSegments: 8, bevelEnabled: true, bevelThickness: size * .06, bevelSize: size * .04, bevelSegments: 4 });
  g.center();
  return shadow(new THREE.Mesh(g, M(color, { metalness: .35, roughness: .3, emissive: emissive || "#000", emissiveIntensity: .4 })));
}

// ---------- rótulos HTML animados
function caption(t, title, sub, t0 = .4) {
  const k = clamp((t - t0) / .6), out = clamp((t - (D - .5)) / .5);
  cap.innerHTML = title + (sub ? `<small>${sub}</small>` : "");
  cap.style.opacity = String(k * (1 - out));
  cap.style.transform = `translateY(${(1 - back(k)) * -60}px) scale(${.7 + .3 * back(k)})`;
}
function badge(t, txt) {
  if (!txt) { tag.style.display = "none"; return; }
  const k = clamp((t - .15) / .5); tag.textContent = txt;
  tag.style.transform = `translateX(-50%) translateY(${(1 - back(k)) * -80}px) scale(${.6 + .4 * back(k)})`; tag.style.opacity = String(k);
}

// ======================================================= ESCENAS
const builders = [];

// 0 — Intro: un «5» gigante girando, signos de interrogación orbitando, confeti
builders[0] = () => {
  scene.background = new THREE.Color("#1a1040"); scene.fog = new THREE.Fog("#1a1040", 14, 40);
  lights("#b388ff", "#311b92");
  const floor = add(new THREE.Mesh(new THREE.CircleGeometry(30, 64), M("#2a1b5e", { roughness: .3, metalness: .4 }))); floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true;
  const ring = add(new THREE.Mesh(new THREE.TorusGeometry(3.2, .06, 12, 120), M("#ffd54f", { emissive: "#ffb300", emissiveIntensity: 1.5 }))); ring.rotation.x = Math.PI / 2; ring.position.y = .05;
  const five = add(text3d("5", 2.6, "#ffb300", "#ff6f00")); five.position.y = 2.2;
  const qs = []; for (let i = 0; i < 6; i++) { const m = add(text3d("?", .8, ["#00e5ff", "#ff4081", "#76ff03"][i % 3], "#222")); qs.push(m); }
  const panda = makePanda(); add(panda.root); panda.root.position.set(2.6, 0, 1.2); panda.root.rotation.y = -.5;
  const spot = add(new THREE.SpotLight("#ffffff", 80, 20, .5, .5)); spot.position.set(0, 9, 3); spot.target = five; spot.castShadow = true;
  confetti(160);
  on(t => {
    const k = back(clamp(t / 1.2));
    five.scale.setScalar(Math.max(.001, k)); five.rotation.y = Math.sin(t * 1.3) * .7 + (1 - k) * 6.283; five.position.y = 2.2 + Math.sin(t * 2) * .15;
    qs.forEach((m, i) => { const a = t * .8 + i * Math.PI / 3; m.position.set(Math.cos(a) * 3.2, 1.2 + Math.sin(t * 2 + i) * .5 + i % 2, Math.sin(a) * 3.2); m.rotation.y = -a + t; });
    ring.scale.setScalar(1 + .05 * Math.sin(t * 4));
    const pk = ease(clamp((t - .6) / 1)); panda.root.position.y = Math.abs(Math.sin(t * 6)) * .25 * (t < 2.2 ? 1 : 0);
    panda.root.position.x = lerp(6, 2.6, pk); panda.arms[1].rotation.z = 2.6 + Math.sin(t * 9) * .35; panda.arms[0].rotation.z = -.2;
    talk(panda, t, t > .5 && t < 6.5);
    const a = lerp(-.9, .35, ease(t / D)); camera.position.set(Math.sin(a) * lerp(13, 8.5, ease(t / D)), lerp(6, 3, ease(t / D)), Math.cos(a) * lerp(13, 8.5, ease(t / D)));
    camera.lookAt(0, 1.8, 0);
    caption(t, "5 DATOS CURIOSOS", "que te van a volar la cabeza", 1.2); badge(t, "");
  });
};

// 1 — Pulpo con 3 corazones latiendo y sangre azul
builders[1] = () => {
  const bg = "#03396c"; scene.background = new THREE.Color(bg); scene.fog = new THREE.FogExp2(bg, .06);
  lights("#4fc3f7", "#01579b", "#b3e5fc", 1.8);
  const sand = add(new THREE.Mesh(new THREE.PlaneGeometry(80, 80, 60, 60), M("#c2a36b", { roughness: 1 }))); sand.rotation.x = -Math.PI / 2; sand.receiveShadow = true;
  const sp = sand.geometry.attributes.position; for (let i = 0; i < sp.count; i++) sp.setZ(i, Math.sin(sp.getX(i) * .6) * .15 + Math.cos(sp.getY(i) * .5) * .15); sand.geometry.computeVertexNormals();
  // algas
  const weeds = []; for (let i = 0; i < 26; i++) { const h = 1.5 + R() * 3; const w = add(new THREE.Mesh(new THREE.CylinderGeometry(.03, .08, h, 6, 8), M(["#2e7d32", "#558b2f", "#00796b"][i % 3]))); w.position.set((R() - .5) * 18, h / 2, -2 - R() * 10); weeds.push([w, R() * 6]); }
  for (let i = 0; i < 12; i++) { const r = add(new THREE.Mesh(new THREE.DodecahedronGeometry(.3 + R() * .6), M("#6d6875", { flatShading: true }))); r.position.set((R() - .5) * 16, .1, -1 - R() * 8); shadow(r); }
  // pulpo
  const oct = add(new THREE.Group()); oct.position.y = 1.4;
  const skin = new THREE.MeshPhysicalMaterial({ color: "#ff7043", roughness: .35, transmission: .45, thickness: 1.2, transparent: true, opacity: .82, clearcoat: .6 });
  const head = add(new THREE.Mesh(new THREE.SphereGeometry(1, 64, 48), skin), oct); head.scale.set(1, 1.25, 1); head.position.y = .9;
  for (const s of [-1, 1]) {
    const e = add(new THREE.Mesh(new THREE.SphereGeometry(.2, 24, 16), M("#fff", { roughness: .1 })), oct); e.position.set(s * .42, .55, .82);
    const p = add(new THREE.Mesh(new THREE.SphereGeometry(.11, 16, 12), M("#111")), oct); p.position.set(s * .44, .55, .99);
  }
  const hearts = [[-.42, 1.05, 0, .22], [.42, 1.05, 0, .22], [0, 1.4, .1, .3]].map(([x, y, z, s], i) => {
    const h = add(new THREE.Mesh(new THREE.SphereGeometry(s, 24, 16), M("#ff1744", { emissive: "#ff1744", emissiveIntensity: 2 })), oct); h.position.set(x, y, z);
    const g = glowSprite("#ff1744", s * 5); g.position.copy(h.position); oct.add(g); return [h, g, i];
  });
  const N = 8, tents = [];
  const tm = new THREE.MeshPhysicalMaterial({ color: "#ff7043", roughness: .4, clearcoat: .5 });
  for (let i = 0; i < N; i++) tents.push({ mesh: add(new THREE.Mesh(new THREE.BufferGeometry(), tm), oct), a: i / N * Math.PI * 2 });
  shadow(oct);
  // sangre azul: partículas que fluyen por los tentáculos
  particles(220, [1, 1, 1], "#2979ff", .09, (x, y, z, t, i) => {
    const tn = i % N, a = tn / N * Math.PI * 2, u = ((t * .35 + i * .013) % 1), r = .4 + u * 2.4;
    return [Math.cos(a + Math.sin(t * 2 + u * 4) * .2) * r, 1.4 + .2 - u * 1.6 + Math.sin(u * 9 + t * 3) * .1, Math.sin(a + Math.sin(t * 2 + u * 4) * .2) * r];
  });
  particles(260, [24, 10, 16], "#e1f5fe", .07, (x, y, z, t) => [x + Math.sin(t + y) * .2, (y + t * .9) % 10, z]);
  const caust = add(new THREE.SpotLight("#80deea", 60, 30, .7, .9)); caust.position.set(0, 12, 0);
  on(t => {
    weeds.forEach(([w, ph]) => { w.rotation.z = Math.sin(t * 1.3 + ph) * .15; w.rotation.x = Math.cos(t + ph) * .08; });
    oct.position.y = 1.4 + Math.sin(t * 1.4) * .25; oct.rotation.y = Math.sin(t * .5) * .4;
    head.scale.set(1 + Math.sin(t * 2.8) * .04, 1.25 - Math.sin(t * 2.8) * .04, 1);
    hearts.forEach(([h, g, i]) => { const beat = Math.pow(Math.max(0, Math.sin(t * 7 + i * 1.3)), 6); h.scale.setScalar(1 + beat * .45); g.material.opacity = .5 + beat * .5; });
    tents.forEach(o => {
      const pts = []; for (let k = 0; k <= 20; k++) { const u = k / 20, r = .45 + u * 2.4, w = Math.sin(t * 2.2 + u * 5 + o.a * 2) * .35 * u;
        pts.push(new THREE.Vector3(Math.cos(o.a + w) * r, .2 - u * 1.4 + Math.sin(u * 6 + t * 3) * .18 * u + u * u * .9, Math.sin(o.a + w) * r)); }
      o.mesh.geometry.dispose(); o.mesh.geometry = new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 40, .17, 10, false);
      const pa = o.mesh.geometry.attributes.position; // afinar la punta
      o.mesh.geometry = taper(o.mesh.geometry); o.mesh.castShadow = true;
    });
    caust.intensity = 50 + Math.sin(t * 3) * 15;
    const a = t / D; camera.position.set(Math.sin(lerp(-.8, .8, a)) * 7, lerp(2.2, 3.4, a), Math.cos(lerp(-.8, .8, a)) * 7); camera.lookAt(0, 2, 0);
    caption(t, "El pulpo tiene 3 corazones", "…¡y su sangre es azul!", .7); badge(t, "DATO #1");
  });
};
function taper(g) { // reduce el radio del tubo hacia la punta
  const p = g.attributes.position, n = p.count, seg = 41, rad = 11;
  const c = new THREE.Vector3();
  for (let s = 0; s < seg; s++) {
    c.set(0, 0, 0); for (let r = 0; r < rad; r++) { const i = s * rad + r; if (i < n) c.add(new THREE.Vector3().fromBufferAttribute(p, i)); } c.divideScalar(rad);
    const f = 1 - s / seg * .85;
    for (let r = 0; r < rad; r++) { const i = s * rad + r; if (i >= n) continue; const v = new THREE.Vector3().fromBufferAttribute(p, i).sub(c).multiplyScalar(f).add(c); p.setXYZ(i, v.x, v.y, v.z); }
  }
  g.computeVertexNormals(); return g;
}

// 2 — Miel milenaria en Egipto
builders[2] = () => {
  scene.background = new THREE.Color("#ffb74d"); scene.fog = new THREE.Fog("#ffcc80", 18, 70);
  const key = lights("#ffe0b2", "#8d6e63", "#ffcc80", 2.8); key.position.set(-6, 6, 4);
  const dunes = add(new THREE.Mesh(new THREE.PlaneGeometry(160, 160, 80, 80), M("#e0a96d", { roughness: 1 }))); dunes.rotation.x = -Math.PI / 2; dunes.receiveShadow = true;
  const dp = dunes.geometry.attributes.position; for (let i = 0; i < dp.count; i++) { const x = dp.getX(i), y = dp.getY(i); const d = Math.hypot(x, y); dp.setZ(i, d < 6 ? 0 : Math.sin(x * .15) * 1.2 + Math.cos(y * .2) * 1.2); } dunes.geometry.computeVertexNormals();
  [[-14, -30, 12], [6, -40, 16], [24, -28, 9]].forEach(([x, z, s]) => { const p = add(new THREE.Mesh(new THREE.ConeGeometry(s, s * 1.1, 4), M("#d7a35e", { roughness: .9, flatShading: true }))); p.position.set(x, s * .55, z); p.rotation.y = Math.PI / 4; shadow(p); });
  const sun = add(glowSprite("#fff59d", 18)); sun.position.set(-20, 14, -60);
  // pedestal y tarro
  const ped = add(new THREE.Mesh(new RoundedBoxGeometry(2.2, 1, 2.2, 4, .08), M("#bcaaa4", { roughness: .8 }))); ped.position.y = .5; shadow(ped);
  for (const s of [-1, 1]) { const col = add(new THREE.Mesh(new THREE.CylinderGeometry(.35, .4, 5, 16), M("#d7ccc8", { roughness: .8 }))); col.position.set(s * 3.2, 2.5, -1.5); shadow(col); }
  const jar = add(new THREE.Group()); jar.position.y = 1;
  const prof = []; [[0, 0], [.55, .05], [.75, .4], [.78, .9], [.6, 1.25], [.42, 1.35], [.45, 1.5], [0, 1.5]].forEach(([x, y]) => prof.push(new THREE.Vector2(x, y)));
  const glass = new THREE.MeshPhysicalMaterial({ color: "#fff8e1", roughness: .05, transmission: .9, thickness: .3, transparent: true, opacity: .45 });
  add(new THREE.Mesh(new THREE.LatheGeometry(prof, 48), glass), jar);
  const honey = add(new THREE.Mesh(new THREE.LatheGeometry(prof.slice(0, 5).map(v => new THREE.Vector2(v.x * .93, v.y * .9)).concat([new THREE.Vector2(0, 1.12)]), 48),
    new THREE.MeshPhysicalMaterial({ color: "#ffa000", emissive: "#ff8f00", emissiveIntensity: .5, roughness: .15, clearcoat: 1 })), jar);
  const lid = add(new THREE.Mesh(new THREE.CylinderGeometry(.5, .5, .2, 32), M("#8d6e63")), jar); lid.position.y = 1.62;
  const glow = add(glowSprite("#ffca28", 5), jar); glow.position.y = .7;
  shadow(jar);
  const drops = []; for (let i = 0; i < 5; i++) { const d = add(new THREE.Mesh(new THREE.SphereGeometry(.08, 16, 12), honey.material)); drops.push(d); }
  const yrs = add(text3d("3000+", .9, "#ffd54f", "#ff6f00")); yrs.position.set(-2.2, 3.1, .5);
  particles(300, [20, 8, 20], "#fff3e0", .06, (x, y, z, t) => [x + t * .6 % 4 - 2, y + Math.sin(t + x) * .3, z]);
  on(t => {
