<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Reproductor Lottie</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:var(--bg,#fff8ec)}#anim{width:100vw;height:100vh}</style></head>
<body><div id="anim"></div>
<script src="../../node_modules/lottie-web/build/player/lottie.min.js"></script>
<script>
  const q = new URLSearchParams(location.search);
  if (q.get("bg")) document.documentElement.style.setProperty("--bg", q.get("bg"));
  window.__ready = false;
  const anim = lottie.loadAnimation({ container: document.getElementById("anim"), renderer: "svg", loop: true,
    autoplay: !q.has("capture"), path: q.get("src") || "lottie/personaje.json" });
  anim.addEventListener("DOMLoaded", () => {
    const fr = anim.frameRate, total = anim.totalFrames;
    const loops = Number(q.get("loops") || 2);
    window.__duration = (total / fr) * loops;
    window.__seek = (t) => anim.goToAndStop(((t * fr) % total), true);
    window.__ready = true;
  });
</script></body></html>
