<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Escena 3D (Three.js)</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#87cefa}canvas{display:block}
#hud{position:absolute;left:12px;bottom:10px;font:14px system-ui;color:#fff;text-shadow:0 1px 2px #000}</style>
<script type="importmap">{"imports":{"three":"../../node_modules/three/build/three.module.js","three/addons/":"../../node_modules/three/examples/jsm/"}}</script>
</head><body><div id="hud"></div>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const q = new URLSearchParams(location.search);
const capture = q.has("capture");
const color = q.get("color") || "#e53935";
const action = q.get("action") || "dance";
window.__ready = false;
window.__duration = Number(q.get("duration") || 4);

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(q.get("sky") || "#8fd3fe");
scene.fog = new THREE.Fog(scene.background, 12, 30);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 1.1, 3.6);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.55, 0);
controls.update();

// Iluminación de tres puntos
scene.add(new THREE.HemisphereLight("#ffffff", "#6d8f4e", 0.9));
const key = new THREE.DirectionalLight("#fff3e0", 2.2); key.position.set(3, 5, 4); key.castShadow = true;
key.shadow.mapSize.set(1024, 1024); scene.add(key);
const rim = new THREE.DirectionalLight("#b3e5fc", 1.2); rim.position.set(-3, 3, -4); scene.add(rim);

const ground = new THREE.Mesh(new THREE.CircleGeometry(20, 64), new THREE.MeshStandardMaterial({ color: q.get("ground") || "#7cb342", roughness: 0.95 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const rnd = (s => () => (s = (s * 16807) % 2147483647) / 2147483647)(7);
for (let i = 0; i < 14; i++) {
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.1, 0.9), new THREE.MeshStandardMaterial({ color: "#6d4c41" }));
  trunk.position.y = 0.45;
  const top = new THREE.Mesh(new THREE.IcosahedronGeometry(0.55, 1), new THREE.MeshStandardMaterial({ color: "#388e3c", flatShading: true }));
  top.position.y = 1.2; g.add(trunk, top);
  const a = rnd() * Math.PI * 2, r = 5 + rnd() * 8;
  g.position.set(Math.cos(a) * r, 0, -Math.abs(Math.sin(a) * r) - 2);
  g.traverse(o => { o.castShadow = true; }); scene.add(g);
}

// Personaje procedural (mismo diseño que el motor 2D/Blender)
function makeCharacter(col) {
  const root = new THREE.Group(), body = new THREE.Group(); root.add(body);
  const M = (c, r = 0.4) => new THREE.MeshStandardMaterial({ color: c, roughness: r });
  const b = new THREE.Mesh(new THREE.SphereGeometry(0.33, 48, 32), M(col, 0.35)); b.scale.set(1, 0.95, 0.92); b.castShadow = true; body.add(b);
  const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.14), M("#795548")); stem.position.y = 0.36; body.add(stem);
  const leaf = new THREE.Mesh(new THREE.SphereGeometry(0.08, 16, 8), M("#4caf50")); leaf.scale.set(1, 0.35, 0.5); leaf.position.set(0.08, 0.4, 0); body.add(leaf);
  const eyes = [];
  for (const s of [-1, 1]) {
    const e = new THREE.Mesh(new THREE.SphereGeometry(0.07, 24, 16), M("#ffffff", 0.2)); e.scale.set(0.9, 1.25, 0.6); e.position.set(s * 0.11, 0.06, 0.28); body.add(e);
    const p = new THREE.Mesh(new THREE.SphereGeometry(0.035, 16, 12), M("#1e161c", 0.3)); p.position.set(s * 0.11, 0.05, 0.33); body.add(p);
    eyes.push(e, p);
  }
  const mouth = new THREE.Mesh(new THREE.SphereGeometry(0.06, 24, 12), M("#5a1423")); mouth.scale.set(1, 0.3, 0.4); mouth.position.set(0, -0.1, 0.3); body.add(mouth);
  const limb = (len, w) => { const g = new THREE.Group(); const m = new THREE.Mesh(new THREE.CylinderGeometry(w, w, len), M("#1e161c")); m.position.y = -len / 2; g.add(m); return g; };
  const arms = [], legs = [];
  for (const s of [-1, 1]) {
    const a = limb(0.28, 0.022); a.position.set(s * 0.31, 0, 0);
    const h = new THREE.Mesh(new THREE.SphereGeometry(0.05, 16, 12), M("#ffffff", 0.3)); h.position.y = -0.28; a.add(h); body.add(a); arms.push(a);
    const l = limb(0.27, 0.026); l.position.set(s * 0.11, -0.27, 0);
    const f = new THREE.Mesh(new THREE.SphereGeometry(0.06, 16, 12), M("#78482f")); f.scale.set(1, 0.6, 1.5); f.position.set(0, -0.27, 0.03); l.add(f); body.add(l); legs.push(l);
  }
  body.position.y = 0.58;
  root.traverse(o => { if (o.isMesh) o.castShadow = true; });
  return { root, body, arms, legs, mouth, eyes };
}

let ch = makeCharacter(color);
scene.add(ch.root);
let mixer = null;
if (q.get("glb")) {
  // Carga el personaje exportado desde Blender (python -m studio character3d …)
  const gltf = await new GLTFLoader().loadAsync(q.get("glb"));
  scene.remove(ch.root); ch = null;
  scene.add(gltf.scene);
  if (gltf.animations.length) { mixer = new THREE.AnimationMixer(gltf.scene); mixer.clipAction(gltf.animations[0]).play(); }
}

function pose(t) {
  if (mixer) { mixer.setTime(t); return; }
  const { body, arms, legs, mouth, eyes, root } = ch;
  const beat = 110 / 60;
  if (action === "dance") {
    const b = Math.abs(Math.sin(t * Math.PI * beat)), ph = t * Math.PI * beat;
    body.position.y = 0.58 + b * 0.07; body.scale.set(1 + 0.05 * (1 - b), 1 - 0.06 * (1 - b), 1);
    root.rotation.y = 0.5 * Math.sin(ph);
    const up = Math.sin(ph) > 0;
    arms[0].rotation.z = up ? -2.6 : -0.6; arms[1].rotation.z = up ? 0.6 : 2.6;
    legs[0].rotation.x = 0.3 * Math.sin(ph); legs[1].rotation.x = -0.3 * Math.sin(ph);
  } else if (action === "walk") {
    const s = Math.sin(t * 2 * Math.PI * 1.6);
    legs[0].rotation.x = 0.55 * s; legs[1].rotation.x = -0.55 * s;
    arms[0].rotation.x = -0.5 * s; arms[1].rotation.x = 0.5 * s; arms[0].rotation.z = -0.2; arms[1].rotation.z = 0.2;
    body.position.y = 0.58 + Math.abs(Math.cos(t * 2 * Math.PI * 1.6)) * 0.03;
    root.position.x = -1.5 + (t / window.__duration) * 3; root.rotation.y = Math.PI / 2 * 0.7;
  } else {
    const ph = (t % 1.2) / 1.2;
    body.position.y = 0.58 + (ph > 0.2 && ph < 0.8 ? 4 * 0.4 * ((ph - 0.2) / 0.6) * (1 - (ph - 0.2) / 0.6) : 0);
    arms[0].rotation.z = -2.5; arms[1].rotation.z = 2.5;
  }
  mouth.scale.y = 0.3 + 0.5 * Math.max(0, Math.sin(t * 9));
  const blink = ((t + 0.3) % 3.1) < 0.12 ? 0.1 : 1;
  for (const e of eyes) e.scale.y = (e.geometry.parameters.radius > 0.05 ? 1.25 : 1) * blink;
}

function render(t) {
  pose(t);
  if (capture) {
    const a = -0.5 + t / window.__duration;
    camera.position.set(Math.sin(a) * 3.6, 1.1, Math.cos(a) * 3.6);
    camera.lookAt(0, 0.55, 0);
  } else controls.update();
  renderer.render(scene, camera);
}
window.__seek = (t) => render(t);
window.__ready = true;
document.getElementById("hud").textContent = capture ? "" : "Arrastra para girar la cámara · Three.js";
if (!capture) {
  const clock = new THREE.Clock();
  renderer.setAnimationLoop(() => render(clock.getElapsedTime() % window.__duration));
}
addEventListener("resize", () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
</script></body></html>
