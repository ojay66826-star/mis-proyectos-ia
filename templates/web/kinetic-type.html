<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Tipografía cinética (GSAP)</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;font-family:"DejaVu Sans",Inter,system-ui,sans-serif;background:#111}
  #bg{position:absolute;inset:0;background:linear-gradient(135deg,#ff006e,#8338ec,#3a86ff);background-size:300% 300%}
  #words{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
  .w{position:absolute;font-weight:900;font-size:13vmin;color:#fff;text-transform:uppercase;opacity:0;letter-spacing:-.02em;
     text-shadow:0 .6vmin 0 rgba(0,0,0,.25);-webkit-text-stroke:.4vmin #1b1030;white-space:nowrap}
  .bar{position:absolute;left:0;bottom:0;height:1.2vmin;background:#ffbe0b;width:0}
</style></head>
<body><div id="bg"></div><div id="words"></div><div class="bar" id="bar"></div>
<script src="../../node_modules/gsap/dist/gsap.min.js"></script>
<script>
  const q = new URLSearchParams(location.search);
  const text = q.get("text") || "Crea animaciones increíbles con inteligencia artificial";
  const words = text.split(/\s+/);
  const box = document.getElementById("words");
  const tl = gsap.timeline({ paused: true });
  const beat = 60 / Number(q.get("bpm") || 120);
  const fx = [
    (el) => ({ from: { scale: 3, opacity: 0, rotation: -12 }, to: { scale: 1, opacity: 1, rotation: 0, ease: "back.out(2)" } }),
    (el) => ({ from: { y: "60vh", opacity: 1 }, to: { y: 0, ease: "power4.out" } }),
    (el) => ({ from: { x: "-80vw", opacity: 1, skewX: 30 }, to: { x: 0, skewX: 0, ease: "expo.out" } }),
    (el) => ({ from: { scaleY: 0, opacity: 1 }, to: { scaleY: 1, ease: "elastic.out(1,0.4)" } }),
  ];
  words.forEach((w, i) => {
    const el = document.createElement("div");
    el.className = "w"; el.textContent = w;
    el.style.color = ["#fff", "#ffbe0b", "#fff", "#8ef6ff"][i % 4];
    box.appendChild(el);
    const f = fx[i % fx.length](el);
    const t = i * beat;
    tl.fromTo(el, f.from, { ...f.to, opacity: 1, duration: beat * 0.8 }, t);
    tl.to(el, { opacity: 0, scale: 0.6, duration: beat * 0.2, ease: "power2.in" }, t + beat * 0.85);
  });
  tl.to("#bg", { backgroundPosition: "100% 100%", duration: words.length * beat, ease: "none" }, 0);
  tl.to("#bar", { width: "100%", duration: words.length * beat, ease: "none" }, 0);
  tl.to({}, { duration: 0.6 });
  window.__duration = tl.duration();
  window.__seek = (t) => { tl.seek(t, false); };
  window.__ready = true;
  if (!q.has("capture")) tl.play();
</script></body></html>
